<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else if .Title }}{{ .Title }} | {{ .Site.Params.name }}{{ else }}{{ .Site.Title }}{{ end }}</title>
    
    {{- /* Include SEO meta tags */ -}}
    {{ partial "seo.html" . }}
    
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    
    <!-- Auto-render extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ]
        });"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-background"></div>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <a href="{{ .Site.BaseURL }}" aria-label="Home">
                        <span class="logo-icon">⚡</span>
                        <span class="logo-text">NAZMUL</span>
                    </a>
                </div>
            </div>
            
            <nav class="sidebar-nav" aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="{{ .Site.BaseURL }}" class="nav-item {{ if .IsHome }}active{{ end }}"><i class="fas fa-home"></i> <span>DASHBOARD</span></a></li>
                    <li><a href="{{ "blog" | relURL }}" class="nav-item {{ if eq .Section "blog" }}active{{ end }}"><i class="fas fa-terminal"></i> <span>LOGS</span></a></li>
                    <li><a href="{{ "contact" | relURL }}" class="nav-item {{ if eq .Section "contact" }}active{{ end }}"><i class="fas fa-envelope"></i> <span>COMMS</span></a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="social-links">
                    <a href="https://{{ .Site.Data.portfolio.personal_information.github }}" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="https://{{ .Site.Data.portfolio.personal_information.linkedin }}" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="https://{{ .Site.Data.portfolio.personal_information.x }}" target="_blank"><i class="fab fa-twitter"></i></a>
                </div>
                <p class="copyright">&copy; {{ now.Year }}</p>
            </div>
        </aside>

        <main class="main-content">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    <!-- Mermaid JS -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: true });
    </script>
</body>
</html>
